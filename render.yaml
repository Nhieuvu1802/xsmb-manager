services:
  - type: web
    name: xsmb-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xsmb-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: xsmb-postgres
    databaseName: xsmb
    user: xsmb
