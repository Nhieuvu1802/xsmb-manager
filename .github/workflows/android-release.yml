name: Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag, ví dụ v1.0.0"
        required: true
        type: string
      publish_to_play:
        description: "Đưa AAB lên Google Play Internal testing"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/mobile/android/app/upload-keystore.jks
    steps:
      - uses: actions/checkout@v4
      - name: Validate release configuration
        shell: bash
        run: |
          test -n "$API_BASE_URL" || { echo "Thiếu repository variable API_BASE_URL"; exit 1; }
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Thiếu secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Thiếu secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Thiếu secret ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Thiếu secret ANDROID_KEY_PASSWORD"; exit 1; }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - name: Restore upload key
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - run: flutter pub get
      - name: Parse Dart sources with formatter
        run: dart format --output=none lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build signed APK and AAB
        run: |
          flutter build apk --release --dart-define=API_BASE_URL=${API_BASE_URL}
          flutter build appbundle --release --dart-define=API_BASE_URL=${API_BASE_URL}
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.release_tag }}
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          generate_release_notes: true
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
      - name: Upload to Google Play Internal testing
        if: ${{ inputs.publish_to_play }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: vn.xsmb.xsmb_manager
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
