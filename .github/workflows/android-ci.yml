name: Android CI

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Parse Dart sources with formatter
        run: dart format --output=none lib test
      - run: flutter analyze
      - run: flutter test
      - name: Build CI APK and AAB
        run: |
          flutter build apk --release --dart-define=API_BASE_URL=${API_BASE_URL}
          flutter build appbundle --release --dart-define=API_BASE_URL=${API_BASE_URL}
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.example.invalid' }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-ci-builds
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

# CI dùng chữ ký debug do Flutter tạo để kiểm thử artifact. Bản đưa lên
# Google Play phải được tạo bởi workflow Android Release với upload key ổn định.
