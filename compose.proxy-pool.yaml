services:
  # ── 9Router — Free AI Router & Token Saver ────────────────────────
  # Dashboard: http://localhost:20128
  # API:       http://localhost:20128/v1/chat/completions
  9router:
    image: decolua/9router:latest
    container_name: 9router
    restart: always
    ports:
      - "${NINEROUTER_PORT:-20128}:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env.proxy-pool
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:20128/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ── Proxy Pool — Automated proxy rotation ────────────────────────
  proxy-pool:
    image: kerling/proxy-pool:latest
    container_name: proxy-pool
    restart: always
    ports:
      - "${PROXY_POOL_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Proxy Rotate — Sidecar: auto-rotate proxy for 9Router ───────
  proxy-rotate:
    build:
      context: .
      dockerfile: scripts/Dockerfile.proxy-rotate
    container_name: proxy-rotate
    restart: always
    environment:
      PROXY_POOL_URL: http://proxy-pool:5000
      ROTATE_INTERVAL: "${ROTATE_INTERVAL:-300}"
      MIN_SCORE: "${MIN_SCORE:-50}"
      PROTOCOL_FILTER: "${PROTOCOL_FILTER:-http}"
      PROXY_OUTPUT_FILE: /9router-data/proxy.env
      NINE_ROUTER_CONTAINER: 9router
    volumes:
      - 9router-data:/9router-data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      proxy-pool:
        condition: service_healthy
      9router:
        condition: service_healthy
    restart: unless-stopped

volumes:
  9router-data:
    name: 9router-data
